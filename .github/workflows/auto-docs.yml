name: Auto Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Generate documentation
        run: |
          python bin/generate-docs.py
      
      - name: Check for changes
        id: changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are any changes
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No documentation changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected"
          fi
      
      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add docs/CHANGELOG.md docs/PROJECT_STATS.md README.md || true
          git commit -m "docs: auto-update documentation [skip ci]

          - Updated CHANGELOG.md
          - Updated PROJECT_STATS.md
          - Updated README.md stats (if applicable)
          
          Generated by automated documentation workflow" || exit 0
          
          git push
      
      - name: Summary
        run: |
          echo "## 📚 Documentation Generation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Documentation updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️  No changes detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "- \`docs/CHANGELOG.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`docs/PROJECT_STATS.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`README.md\` (if markers present)" >> $GITHUB_STEP_SUMMARY
