name: Auto Solve GitHub Issues

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  solve-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run solve_github_issue.py
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          python .github/scripts/solve_github_issue.py $ISSUE_NUMBER
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/idd/issues/issue-${{ github.event.issue.number }}
          git commit -m "auto: solve GitHub issue #${{ github.event.issue.number }}"
          git pull --rebase origin prod-2027.0.0
          git push
