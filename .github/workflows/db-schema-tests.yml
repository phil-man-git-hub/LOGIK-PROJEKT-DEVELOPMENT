name: DB Schema Tests

on:
  push:
    branches:
      - feature/sqlite-database-integration
  pull_request:
    branches:
      - dev-2027.0.0

jobs:
  db-tests:
    name: Run DB Schema Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
      - name: Run targeted tests
        run: |
          pytest -q tests/test_db_schema.py tests/test_db_operations.py tests/test_monitor_import.py -q
