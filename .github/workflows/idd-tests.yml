name: IDD Scripts Tests

on:
  push:
    paths:
      - '.github/scripts/**'
      - 'tests/idd/**'
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'tests/idd/**'

jobs:
  test:
    name: Run IDD Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML
          
      - name: ✅ Run tests
        run: |
          pytest tests/idd/
