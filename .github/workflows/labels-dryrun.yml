name: Label definitions dry-run

on:
  pull_request:
    paths:
      - ".github/labels.yml"

permissions:
  contents: read
  issues: read

jobs:
  label-dryrun:
    name: Run label sync dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Run label sync (dry-run)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/sync_labels.py --dry-run --labels-file .github/labels.yml
